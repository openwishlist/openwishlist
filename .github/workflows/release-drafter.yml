name: Release Drafter

on:
  pull_request_target:
    types: ["opened", "closed", "reopened", "synchronize"]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-name: release-drafter.yml